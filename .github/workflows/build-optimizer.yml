name: Build TiHiY System Optimizer
on:
  workflow_dispatch:
  push:
    branches: [ "feature/tihiy-system-optimizer-v0.1" ]
    paths: [ "TiHiY-System-Optimizer/**", ".github/workflows/build-optimizer.yml" ]
  pull_request:
    paths: [ "TiHiY-System-Optimizer/**", ".github/workflows/build-optimizer.yml" ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore TiHiY-System-Optimizer/TiHiY-System-Optimizer.sln
      - name: Build
        run: dotnet build TiHiY-System-Optimizer/TiHiY-System-Optimizer.sln -c Release --no-restore
      - name: Publish single EXE
        run: dotnet publish TiHiY-System-Optimizer/src/TiHiY.SystemOptimizer/TiHiY.SystemOptimizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/TiHiY-System-Optimizer
      - name: Capture real UI at supported window sizes
        shell: pwsh
        env:
          TIHIY_UI_SNAPSHOT: "1"
        run: |
          New-Item -ItemType Directory -Force artifacts/ui-preview | Out-Null
          $dll = (Get-ChildItem "TiHiY-System-Optimizer/src/TiHiY.SystemOptimizer/bin/Release" -Recurse -Filter "TiHiY System Optimizer.dll" | Where-Object { $_.FullName -notmatch '\\ref\\' } | Select-Object -First 1).FullName
          if (!$dll) { throw "Built application DLL was not found" }

          $sizes = @(
            @{ W = 1040; H = 700; Name = "optimizer-1040x700.png" },
            @{ W = 1280; H = 800; Name = "optimizer-1280x800.png" },
            @{ W = 1600; H = 900; Name = "optimizer-1600x900.png" }
          )

          foreach ($size in $sizes) {
            $target = Join-Path "artifacts/ui-preview" $size.Name
            dotnet $dll --snapshot $target $size.W $size.H
            if (!(Test-Path $target)) { throw "UI snapshot was not created: $target" }
          }
      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-System-Optimizer-ui-preview
          path: artifacts/ui-preview/
          if-no-files-found: error
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-System-Optimizer-v0.1-win-x64
          path: artifacts/TiHiY-System-Optimizer/
          if-no-files-found: error
